name: Deploy Central Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-central-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "central-dashboard-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate dashboard files and JavaScript syntax
        run: |
          set -e
          test -s dashboard/index.html
          grep -qi 'Knowledge workspace' dashboard/index.html
          grep -q 'api.github.com/repos/' dashboard/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path

          pages = sorted(Path("dashboard").glob("*.html"))
          assert pages, "No dashboard pages found"
          checks = []
          for page in pages:
              blocks = re.findall(r"<script>(.*?)</script>", page.read_text(encoding="utf-8"), re.S)
              for index, block in enumerate(blocks):
                  target = Path("/tmp") / f"{page.stem}-{index}.js"
                  target.write_text(block, encoding="utf-8")
                  checks.append(f"{page}:{index}\t{target}")
          assert checks, "No inline application scripts found"
          Path("/tmp/dashboard-script-checks.tsv").write_text("\n".join(checks) + "\n", encoding="utf-8")
          print(f"Checking {len(checks)} inline script block(s) across {len(pages)} page(s)")
          PY
          while IFS=$'\t' read -r origin target; do
            echo "node --check ${origin%%:*}"
            node --check "$target"
          done < /tmp/dashboard-script-checks.tsv

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
