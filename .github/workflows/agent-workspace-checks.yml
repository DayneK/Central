name: Central semantic workspace checks

# The security audit scans every tracked text file in the repository, so the
# path filters must cover every directory it reads - not just the data that the
# semantic validator happens to inspect.
on:
  push:
    paths:
      - "agents/**"
      - "shared/**"
      - "projects/**"
      - "system/**"
      - "creative/**"
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      - "*.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "agents/**"
      - "shared/**"
      - "projects/**"
      - "system/**"
      - "creative/**"
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      - "*.md"
      - ".github/workflows/**"
  schedule:
    # Weekly drift check. Path filters do not apply to scheduled runs.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Health gate threshold"
        type: choice
        options:
          - invalid
          - attention
          - none
        default: invalid

permissions:
  contents: read

concurrency:
  group: "central-workspace-checks"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_FAIL_ON: ${{ github.event.inputs.fail_on || 'invalid' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Snapshot provenance is checked against Git history, so shallow
          # clones would report every older snapshot as missing.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate agent workspaces and communication data
        run: python scripts/agent_workspace.py validate
      - name: Validate explicit semantic substrate
        run: python scripts/semantic_validate.py --check-git
      - name: Run repository security hygiene audit
        run: python scripts/security_audit.py
      - name: Inspect goal graphs
        run: python scripts/agent_workspace.py goals
      - name: Preview ledger routing
        run: python scripts/agent_workspace.py route --dry-run
      - name: Run workspace unit tests
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Run dashboard operations tests
        run: node --test tests/js/operations.test.mjs
      - name: Write coordination health artifact
        run: python scripts/coordination_health.py --format json > coordination-health.json
      - name: Upload coordination health artifact
        uses: actions/upload-artifact@v4
        with:
          name: coordination-health
          path: coordination-health.json
          retention-days: 90
      - name: Enforce coordination health gate
        run: python scripts/coordination_health.py --format text --fail-on "$HEALTH_FAIL_ON"
      - name: Publish coordination health summary
        if: always()
        run: python scripts/coordination_health.py --format markdown >> "$GITHUB_STEP_SUMMARY"
